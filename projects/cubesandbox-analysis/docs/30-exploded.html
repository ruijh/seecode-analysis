:root{--sc-max:1200px}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--sc-paper);color:var(--sc-ink)}
body{font-family:var(--sc-font-sans);min-height:100vh;display:flex;justify-content:center;padding:48px 24px 40px}
.sc-page{width:100%;max-width:var(--sc-max,1200px)}
.sc-head{margin-bottom:20px;max-width:760px}
.sc-eyebrow{font-family:var(--sc-font-mono);font-size:11px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--sc-muted);margin-bottom:8px}
.sc-title{font-family:var(--sc-font-serif);font-weight:400;font-size:clamp(26px,2.4vw + 12px,36px);line-height:1.12;letter-spacing:-.015em;color:var(--sc-ink)}
.sc-subtitle{margin-top:8px;color:var(--sc-muted);font-size:15px;line-height:1.5}
.sc-figure{position:relative;border-radius:10px}
.sc-stage{position:relative;overflow:hidden;border-radius:10px;touch-action:none}
.sc-stage .sc-svg{-webkit-user-select:none;user-select:none}
.sc-stage.is-zoomed{cursor:grab;outline:1px solid var(--sc-rule)}
.sc-stage.is-panning{cursor:grabbing}
.sc-svg{display:block;width:100%;height:auto;max-height:82vh;margin:0 auto;transform-origin:0 0}
.sc-caption{margin-top:14px;color:var(--sc-muted);font-family:var(--sc-font-serif);font-style:italic;font-size:15px;max-width:760px}
.sc-evidence{margin-top:16px;font-family:var(--sc-font-mono);font-size:11px;color:var(--sc-soft);line-height:1.7}
.sc-evidence summary{cursor:pointer;letter-spacing:.14em;text-transform:uppercase}
.sc-evidence code{color:var(--sc-muted)}
.sc-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px}
.sc-btn,.sc-search{font:500 11px/1 var(--sc-font-mono);letter-spacing:.06em;color:var(--sc-muted);background:transparent;border:1px solid var(--sc-rule);border-radius:6px;padding:7px 10px;cursor:pointer}
.sc-btn:hover{color:var(--sc-ink);border-color:var(--sc-rule-solid)}
.sc-btn[aria-pressed="true"]{color:var(--sc-accent);border-color:var(--sc-accent)}
.sc-theme{display:inline-flex;align-items:center;gap:7px}
.sc-switch{position:relative;width:24px;height:13px;border-radius:7px;background:var(--sc-rule-solid);transition:background .2s}
.sc-switch::after{content:'';position:absolute;top:2px;left:2px;width:9px;height:9px;border-radius:50%;background:var(--sc-paper);transition:transform .2s}
.sc-theme[aria-checked="true"]{color:var(--sc-ink)}
.sc-theme[aria-checked="true"] .sc-switch{background:var(--sc-accent)}
.sc-theme[aria-checked="true"] .sc-switch::after{transform:translateX(11px)}
@media (prefers-reduced-motion: reduce){.sc-switch,.sc-switch::after{transition:none}}
.sc-search{cursor:text;width:150px;letter-spacing:0}
.sc-search::placeholder{color:var(--sc-soft)}
.sc-spacer{flex:1}
.sc-menu{position:relative}
.sc-menu-list{position:absolute;right:0;top:calc(100% + 6px);z-index:5;display:none;flex-direction:column;min-width:150px;padding:4px;background:var(--sc-paper);border:1px solid var(--sc-rule-solid);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.08)}
.sc-menu.is-open .sc-menu-list{display:flex}
.sc-menu-list button{all:unset;cursor:pointer;font:400 12px/1 var(--sc-font-sans);color:var(--sc-ink);padding:8px 10px;border-radius:5px}
.sc-menu-list button:hover,.sc-menu-list button:focus-visible{background:var(--sc-paper-2)}
.sc-status{font:400 11px/1.4 var(--sc-font-mono);color:var(--sc-soft);min-height:16px;margin-top:8px}
.sc-node{cursor:pointer;outline:none;transition:filter .2s}
.sc-edge{transition:filter .2s}
.sc-node:focus-visible .n-box{stroke:var(--sc-accent);stroke-width:2}
.sc-svg.is-dim .sc-node:not(.is-lit):not(.is-past):not(.is-current):not(.is-future),.sc-svg.is-dim .sc-edge:not(.is-lit):not(.is-past):not(.is-current):not(.is-future),.sc-svg.is-dim .sc-dimmable:not(.is-lit){filter:opacity(.14)}
.sc-svg.is-dim .sc-groups,.sc-svg.is-dim .sc-legend,.sc-svg.is-dim .sc-lanes{filter:opacity(.45)}
.sc-svg.is-dim .e-token{display:none}
.sc-node.is-hit .n-box{stroke:var(--sc-accent);stroke-width:2}
.sc-edge.is-lit .e-line{stroke-width:1.8}
.sc-svg.sc-stepping [data-sc-step]{transition:filter .25s}
.sc-svg.sc-stepping [data-sc-step]:not(.is-shown){filter:opacity(.06)}
.sc-svg.sc-stepping .e-token{display:none}
.sc-mini{position:absolute;right:10px;bottom:10px;width:168px;background:var(--sc-paper);border:1px solid var(--sc-rule-solid);border-radius:6px;padding:4px;box-shadow:0 4px 16px rgba(0,0,0,.08);cursor:pointer;z-index:4}
.sc-mini .sc-svg{max-height:120px;width:100%;transform:none!important}
.sc-mini-view{position:absolute;border:1.5px solid var(--sc-accent);background:var(--sc-accent-tint);border-radius:2px;pointer-events:none;margin:4px}
.sc-legend [data-sc-kind]:hover,.sc-legend [data-sc-ekind]:hover{opacity:.7}
.sc-svg.sc-cam{transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.sc-stage.is-picking .sc-node{cursor:crosshair}
.sc-svg.is-dim .sc-node.is-past,.sc-svg.is-dim .sc-edge.is-past{filter:opacity(.6)}
.sc-svg.is-dim .sc-node.is-future,.sc-svg.is-dim .sc-edge.is-future{filter:opacity(.32)}
.sc-svg.is-dim .sc-node[data-depth="2"]{filter:opacity(.82)}.sc-svg.is-dim .sc-node[data-depth="3"]{filter:opacity(.68)}.sc-svg.is-dim .sc-node[data-depth="4"]{filter:opacity(.56)}
.sc-node.is-current .n-box{stroke:var(--sc-accent);stroke-width:2.2;filter:drop-shadow(0 0 6px var(--sc-accent-tint))}
.sc-edge.is-current .e-line{stroke:var(--sc-accent);stroke-width:2}
.sc-comet{fill:none;stroke-width:3.2;stroke-linecap:round;stroke-dasharray:.1 .9;stroke-dashoffset:0;opacity:0;animation:sc-comet 1.15s linear both;pointer-events:none}
.sc-comet.c-out,.sc-comet.c-loop,.sc-comet.c-journey,.sc-comet.c-preview{stroke:var(--sc-accent)}
.sc-comet.c-in{stroke:var(--sc-link)}
.sc-comet.c-reach{stroke:var(--sc-accent);animation-duration:1.1s}
.sc-comet.c-journey{stroke-width:3.8;animation:sc-comet .78s cubic-bezier(.22,1,.36,1) both;filter:drop-shadow(0 0 4px var(--sc-accent))}
.sc-comet.is-static{animation:none;stroke-dasharray:none;opacity:.5}
@keyframes sc-comet{0%{opacity:.25;stroke-dashoffset:0}12%,78%{opacity:.95}100%{opacity:0;stroke-dashoffset:-1}}
.sc-ftok{offset-rotate:auto;offset-distance:0%;animation:sc-ftok 1.2s cubic-bezier(.2,0,.2,1) both;pointer-events:none}
@keyframes sc-ftok{0%{offset-distance:0%;opacity:0}10%{opacity:1}90%{opacity:1}100%{offset-distance:100%;opacity:0}}
.sc-ftok .t-halo{fill:var(--sc-paper);stroke:var(--sc-accent);stroke-opacity:.35;stroke-width:1}
.sc-ftok .t-shape{fill:var(--sc-accent-tint);stroke:var(--sc-accent);stroke-width:1.1}
.sc-ftok .t-ink{fill:none;stroke:var(--sc-accent);stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.sc-ftok .t-dot{fill:var(--sc-accent)}
@media (prefers-reduced-motion: reduce){.sc-comet{animation:none;stroke-dasharray:none;opacity:.5}.sc-ftok{display:none}.sc-svg.sc-cam{transition:none}}
.sc-panel{position:absolute;left:12px;top:12px;z-index:5;width:300px;max-height:calc(100% - 24px);overflow:auto;background:var(--sc-paper);border:1px solid var(--sc-rule-solid);border-radius:10px;box-shadow:0 10px 32px rgba(0,0,0,.12);font-size:12px;animation:sc-panel-in .22s ease-out both}

<script>const __scScopeCss = function scopeCss(css, id) {
  const sel = (list) => list.split(',').map((s) => {
    const x = s.trim();
    if (!x) return x;
    if (x.startsWith(':root')) return `#${id}${x.slice(5)}`;
    if (x.startsWith('.sc-svg')) return `#${id}${x}`;
    return `#${id} ${x}`;
  }).join(',');
  let out = '';
  let i = 0;
  while (i < css.length) {
    const open = css.indexOf('{', i);
    if (open < 0) { out += css.slice(i); break; }
    let depth = 1;
    let j = open + 1;
    while (j < css.length && depth) {
      if (css[j] === '{') depth++;
      else if (css[j] === '}') depth--;
      j++;
    }
    const head = css.slice(i, open);
    const body = css.slice(open + 1, j - 1);
    const at = head.trim();
    if (/^@(media|supports|container)\b/.test(at)) out += `${head}{${scopeCss(body, id)}}`;
    else if (at.startsWith('@')) out += `${head}{${body}}`;
    else out += `${head.slice(0, head.length - head.trimStart().length)}${sel(at)}{${body}}`;
    i = j;
  }
  return out;
};

  const BUDGET = {

    const text = encodeURIComponent([...chars].join(''));
    // every family the page loads: SeeCode's own plus any brand fonts

    return fontCss;
  }
  function frameSvg(clone, fonts) {
    const cs = getComputedStyle(root);
    const names = (document.getElementById('sc-token-names').textContent || '').split(',');
    const vars = names.map((n) => `${n}:${cs.getPropertyValue(n).trim()}`).join(';');
    const css = document.getElementById('sc-diagram-css').textContent;
    const style = document.createElementNS(NS, 'style');
    const fontsLink = document.getElementById('sc-fonts');
    const fontRule = fonts || (fontsLink ? `@import url('${fontsLink.href}');` : '');
    // scoped to the diagram's id so several exports can share one page
    const rules = `:root{${vars}}${css}`;
    style.textContent = `${fontRule}${clone.id && typeof __scScopeCss === 'function' ? __scScopeCss(rules, clone.id) : rules}`;
    clone.insertBefore(style, clone.firstChild);
    const h1 = document.querySelector('.sc-title');
    if (h1 && !clone.querySelector('title')) {
      const t = document.createElementNS(NS, 'title');
      t.id = h1.id;
      t.textContent = h1.textContent;
      clone.insertBefore(t, clone.firstChild);
    }
    const vb = svg.viewBox.baseVal;
    clone.setAttribute('width', vb.width);
    clone.setAttribute('height', vb.height);
    clone.setAttribute('xmlns', NS);
    return { text: new XMLSerializer().serializeToString(clone), w: vb.width, h: vb.height };
  }
  function cleanClone() {
    const clone = svg.cloneNode(true);
    clone.classList.remove('is-dim', 'sc-cam', 'sc-stepping');
    clone.removeAttribute('style');
    clone.querySelectorAll('.sc-overlay').forEach((x) => x.remove());
    clone.querySelectorAll('.is-lit,.is-hit,.is-past,.is-current,.is-future').forEach((x) => x.classList.remove('is-lit', 'is-hit', 'is-past', 'is-current', 'is-future'));
    return clone;
  }
  function standaloneSvg(fonts) {
    const clone = cleanClone();
    clone.classList.add('sc-still');
    clone.removeAttribute('data-sc-motion');
    return frameSvg(clone, fonts);
  }
  // Freeze the live animations at time t and copy their animated values onto a clone.
  const ANIMATED_PROPS = ['opacity', 'transform', 'transform-origin', 'transform-box', 'stroke-dashoffset', 'stroke-dasharray', 'clip-path', 'display'];
  const measure = document.createElementNS(NS, 'path');
  function bakeFrame(t, anims, fonts) {
    anims.forEach((a) => { a.currentTime = t; });
    const live = [svg, ...svg.querySelectorAll('*')];
    const clone = cleanClone();
    const copies = [clone, ...clone.querySelectorAll('*')];
    live.forEach((el, i) => {
      if (!el.getAnimations || !el.getAnimations().length) return;
      const cs = getComputedStyle(el);
      const c = copies[i];
      ANIMATED_PROPS.forEach((p) => c.style.setProperty(p, cs.getPropertyValue(p)));
      const op = cs.getPropertyValue('offset-path');
      const m = op && op.match(/path\("(.+)"\)/);
      if (m) {
        // flow tokens: resolve their motion-path position into a plain translate
        // (the measuring path must be in the document for getTotalLength to work)
        if (!measure.isConnected) { measure.setAttribute('visibility', 'hidden'); measure.setAttribute('fill', 'none'); svg.appendChild(measure); }
        measure.setAttribute('d', m[1]);
        const len = measure.getTotalLength();
        const pt = measure.getPointAtLength((parseFloat(cs.getPropertyValue('offset-distance')) / 100) * len);
        c.style.setProperty('offset-path', 'none');
        c.style.setProperty('transform', `translate(${pt.x}px, ${pt.y}px)`);
        c.style.setProperty('transform-box', 'view-box');
        c.style.setProperty('transform-origin', '0 0');
        c.style.setProperty('display', cs.display === 'none' ? 'none' : 'inline');
      }
    });
    if (measure.isConnected) measure.remove();
    const style = document.createElementNS(NS, 'style');
    style.textContent = '*{animation:none!important;transition:none!important}';
    clone.appendChild(style);
    return frameSvg(clone, fonts).text;
  }
  function svgToCanvas(text, w, h, k, canvas) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.fillStyle = getComputedStyle(root).getPropertyValue('--sc-paper').trim() || '#fff';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas);
      };
      img.onerror = () => reject(new Error('could not rasterize SVG'));
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(text);
    });
  }
  function download(blob, name) {
    window.SeeCode.lastExport = { name, size: blob.size, type: blob.type, blob };
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
  async function raster(type) {
    const s = standaloneSvg(await embeddedFonts());
    const plan = exportPlan(type === 'image/jpeg' ? 'jpeg' : 'png');
    if (plan.warn) say(plan.warn);
    const k = plan.scale;
    const c = document.createElement('canvas');
    c.width = Math.round(s.w * k);
    c.height = Math.round(s.h * k);
    await svgToCanvas(s.text, s.w, s.h, k, c);
    return new Promise((resolve, reject) => c.toBlob((b) => (b ? resolve(b) : reject(new Error('canvas empty'))), type, 0.92));
  }
  // Render every frame of the animation into canvases.
  async function frames({ fps, plan }) {
    endStepping();
    setFocus(null, { silent: true });
    stopJourney();
    clearLit();
    clearOverlay();
    const wasLive = live;
    setLive(true);
    svg.classList.remove('sc-still-ui');
    const anims = svg.getAnimations({ subtree: true }).filter((a) => !(a.effect && a.effect.target && a.effect.target.closest && a.effect.target.closest('.sc-overlay')));
    anims.forEach((a) => { a.cancel(); a.play(); a.pause(); });
    let finite = 0, loop = 0;
    for (const a of anims) {
      const t = a.effect.getComputedTiming();
      if (t.iterations === Infinity) loop = Math.max(loop, (t.delay || 0) + (t.duration || 0));
      else finite = Math.max(finite, t.endTime || 0);
    }
    const settle = parseFloat(getComputedStyle(svg).getPropertyValue('--sc-settle')) || 0;
    const total = Math.min(14000, Math.max(finite, settle, loop) + 900);
    const fonts = await embeddedFonts();
    const vb = svg.viewBox.baseVal;
    const k = plan.scale;
    const W = plan.width & ~1, H = plan.height & ~1;
    const count = Math.max(2, Math.round((total / 1000) * fps));
    const out = [];
    for (let i = 0; i < count; i++) {
      const c = document.createElement('canvas');
      c.width = W;
      c.height = H;
      await svgToCanvas(bakeFrame((i * 1000) / fps, anims, fonts), vb.width, vb.height, k, c);
      out.push(c);
      if (i % 5 === 0) say(`Rendering frames ${i + 1}/${count}…`);
    }
    anims.forEach((a) => a.play());
    setLive(wasLive);
    return { canvases: out, W, H };
  }
  async function exportGif() {
    say('Loading GIF encoder…');
    const { GIFEncoder, quantize, applyPalette } = await lib('gifenc');
    const plan = exportPlan('gif');
    const fps = plan.fps;
    const { canvases, W, H } = await frames({ fps, plan });
    say('Encoding GIF…');
    const data = (c) => c.getContext('2d').getImageData(0, 0, W, H).data;
    // one palette from the finished frame (index 255 = "unchanged", transparent)
    const palette = quantize(data(canvases[canvases.length - 1]), 255);
    while (palette.length < 255) palette.push([0, 0, 0]);
    palette.push([255, 0, 255]);
    const gif = GIFEncoder();
    let prev = null;
    canvases.forEach((c, i) => {
      const idx = applyPalette(data(c), palette.slice(0, 255));
      let frame = idx;
      if (prev) { frame = new Uint8Array(idx.length); for (let p = 0; p < idx.length; p++) frame[p] = idx[p] === prev[p] ? 255 : idx[p]; }
      gif.writeFrame(frame, W, H, { palette: i ? undefined : palette, delay: i === canvases.length - 1 ? 1600 : Math.round(1000 / fps), repeat: 0, transparent: i > 0, transparentIndex: 255, dispose: 1 });
      prev = idx;
    });
    gif.finish();
    download(new Blob([gif.bytes()], { type: 'image/gif' }), slug + '.gif');
    say(`GIF saved: ${W}×${H}, ${canvases.length} frames.${plan.warn ? ` Note: ${plan.warn}.` : ''}`);
  }
  async function exportVideo() {
    if (typeof VideoEncoder === 'undefined') throw new Error('this browser has no WebCodecs video encoder; try Chrome, Edge or Safari');
    const fps = 30;
    const plan = exportPlan('mp4');
    const { canvases, W, H } = await frames({ fps, plan });
    let kind = 'mp4', codec = null;
    for (const c of ['avc1.640033', 'avc1.640028', 'avc1.4d0028', 'avc1.42e01f']) {
      if ((await VideoEncoder.isConfigSupported({ codec: c, width: W, height: H, bitrate: 6e6, framerate: fps }).catch(() => ({}))).supported) { codec = c; break; }
    }
    if (!codec) {
      kind = 'webm';
      for (const c of ['vp09.00.40.08', 'vp8']) {
        if ((await VideoEncoder.isConfigSupported({ codec: c, width: W, height: H, bitrate: 6e6, framerate: fps }).catch(() => ({}))).supported) { codec = c; break; }
      }
    }
    if (!codec) throw new Error('no H.264 or VP9 encoder available in this browser');
    say(`Loading ${kind.toUpperCase()} muxer…`);
    const M = await lib(kind);
    const target = new M.ArrayBufferTarget();
    const muxer = kind === 'mp4'
      ? new M.Muxer({ target, video: { codec: 'avc', width: W, height: H, frameRate: fps }, fastStart: 'in-memory' })
      : new M.Muxer({ target, video: { codec: codec.startsWith('vp09') ? 'V_VP9' : 'V_VP8', width: W, height: H, frameRate: fps } });
    let failure = null;
    const enc = new VideoEncoder({ output: (chunk, m) => muxer.addVideoChunk(chunk, m), error: (e) => { failure = e; } });
    enc.configure({ codec, width: W, height: H, bitrate: Math.min(12e6, W * H * fps * 0.12), framerate: fps, ...(kind === 'mp4' ? { avc: { format: 'avc' } } : {}) });
    say(`Encoding ${kind.toUpperCase()}…`);
    const seq = canvases.concat(Array(Math.round(fps * 1.2)).fill(canvases[canvases.length - 1]));
    for (let i = 0; i < seq.length; i++) {
      const vf = new VideoFrame(seq[i], { timestamp: Math.round((i * 1e6) / fps), duration: Math.round(1e6 / fps) });
      enc.encode(vf, { keyFrame: i % (fps * 2) === 0 });
      vf.close();
      if (enc.encodeQueueSize > 8) await new Promise((r) => setTimeout(r, 5));
    }
    await enc.flush();
    if (failure) throw failure;
    muxer.finalize();
    download(new Blob([target.buffer], { type: kind === 'mp4' ? 'video/mp4' : 'video/webm' }), `${slug}.${kind}`);
    say(`${kind.toUpperCase()} saved: ${W}×${H}, ${(seq.length / fps).toFixed(1)} s.${plan.warn ? ` Note: ${plan.warn}.` : ''}`);
  }
  async function doExport(kind) {
    if (kind === 'svg') return download(new Blob([standaloneSvg(await embeddedFonts()).text], { type: 'image/svg+xml' }), slug + '.svg');
    if (kind === 'png') return download(await raster('image/png'), slug + '.png');
    if (kind === 'jpeg') return download(await raster('image/jpeg'), slug + '.jpg');
    if (kind === 'gif') return exportGif();
    if (kind === 'mp4') return exportVideo();
    if (kind === 'copy') {
      const blob = await raster('image/png');
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      say('PNG copied to clipboard.');
    }
  }

  // ---- deep links ----------------------------------------------------------
  function applyHash() {
    const hash = decodeURIComponent(location.hash.slice(1));
    const fm = hash.match(/^focus=(.+)$/);
    const rm = hash.match(/^route=([^,]+),(.+)$/);
    if (fm && nodeEls.has(fm[1])) setFocus(fm[1], { silent: true });
    else if (rm && nodeEls.has(rm[1]) && nodeEls.has(rm[2])) startJourney(rm[1], rm[2]);
  }
  // Layout is measured for SeeCode's fonts; a brand typeface can run wider.
  // Once fonts load, squeeze any label that would spill out of its box.
  function fitLabels() {
    svg.querySelectorAll('.sc-node').forEach((g) => {
      const box = g.querySelector('.n-box');
      if (!box || !box.getBBox) return;
      const room = box.getBBox().width - 12;
      g.querySelectorAll('text.n-label, text.n-sub').forEach((t) => {
        if (room > 0 && t.getComputedTextLength() > room) {
          t.setAttribute('textLength', room.toFixed(1));
          t.setAttribute('lengthAdjust', 'spacingAndGlyphs');
        }
      });
    });
  }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitLabels);
  requestAnimationFrame(applyHash);
  window.addEventListener('hashchange', applyHash);

  window.SeeCode = { replay, setLive, setFocus, startJourney, route, reach, frame, resetView, standaloneSvg, doExport, bakeFrame, exportPlan };
})();
</script>
</body>
</html>
